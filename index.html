<!DOCTYPE html>
<html>
    <head>
         <title>A-Frame Primitives</title> 
         <script src= "https://aframe.io/releases/1.7.0/aframe.min.js"> </script>
        </head>
        <body> 
            <a-scene>  
<a-box
color="deeppink"
position="-6 7 -8"
rotation="0 60 0"
width="3"
height="3"
depth="4"
>
</a-box>
<a-sphere
color="lightpink"
position="0 7 -5"
radius="2.5"
>
</a-sphere>
<a-cylinder
color="plum"
position="4 6 -9"
rotation="65 0 0"
radius="1.5"
height="2"
>
</a-cylinder>
<a-cone
color="darkturquoise"
position="-6 0 -6"
rotation="-35 0 0"
radius-bottom="1.5"
height="4"
>
</a-cone>
<a-plane
color="midnightblue"
position="2 2 -9"
rotation="-79 0 0"
width="6"
height="7"
>
</a-plane>
<a-text
value="Hello, Claire Ehiede!"
color="gold"
position="3 0 -8"
width="20"
>
</a-text>
<a-sky
color="mistyrose"
>
</a-sky>
      </a-scene>
        </body>
        </html>
